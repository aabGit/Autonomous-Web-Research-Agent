[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-web-research-agent"
version = "0.1.0"
description = "Autonomous web research agent with LangGraph, MCP, and RAG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-anthropic>=0.3.0",
  "langchain-ollama>=0.2.0",
  "langchain-aws>=0.2.0",
  "langgraph>=0.2.0",
  "langsmith>=0.1.0",
  "mcp>=1.0.0",
  "chromadb>=0.5.0",
  "pinecone>=6.0.0",
  "ddgs>=9.0.0",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "strawberry-graphql[fastapi]>=0.253.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
research-agent = "research_agent.cli:main"
research-mcp = "research_agent.mcp_server:main"
research-api = "research_agent.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
